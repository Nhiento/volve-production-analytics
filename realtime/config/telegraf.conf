# Telegraf: MQTT -> InfluxDB
#
# Three subscriptions, three measurements in InfluxDB:
#   volve/<well>/<tag>     -> sensor       (the readings)
#   dq/<well>/<tag>        -> dq_event     (one row per data-quality problem)
#   dq_summary/<well>      -> dq_summary   (rolling scorecard per well)
#
# The source-to-target mapping lives here: topic levels become InfluxDB tags,
# JSON keys become fields, and "ts" (the field date) becomes the point's timestamp.

[agent]
  interval = "5s"
  flush_interval = "2s"
  metric_batch_size = 5000
  metric_buffer_limit = 500000
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "volve"
  bucket = "volve"

# ---------------------------------------------------------------- readings
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["volve/+/+"]
  qos = 1
  client_id = "telegraf-sensors"
  persistent_session = true          # broker queues messages for us if Telegraf restarts
  max_undelivered_messages = 50000   # how many messages Telegraf takes before writing them
  topic_tag = ""                     # the topic is split into tags below instead
  name_override = "sensor"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "volve/+/+"
    tags = "_/well/tag"              # volve/F-12/downhole_pressure -> well=F-12, tag=downhole_pressure

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "unit"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "quality"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true                # absent when quality = no_data
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sent_at"
      type = "float"

# ---------------------------------------------------------------- data-quality events
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["dq/+/+"]
  qos = 0
  client_id = "telegraf-dq-events"
  topic_tag = ""
  name_override = "dq_event"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "dq/+/+"
    tags = "_/well/tag"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "check"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detail"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true

# ---------------------------------------------------------------- data-quality scorecard
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["dq_summary/+"]
  qos = 0
  client_id = "telegraf-dq-summary"
  topic_tag = ""
  name_override = "dq_summary"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "dq_summary/+"
    tags = "_/well"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "completeness_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "validity_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "issues_total"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "stale_tags"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "latency_ms_avg"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "latency_ms_p95"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "feed_ok"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "publisher_online"
      type = "int"
