# Mosquitto 2 refuses outside connections unless a listener is declared.
listener 1883

# Local demo only: anyone on this machine can connect without a password.
# A real platform uses usernames/passwords or client certificates plus TLS (port 8883)
# and per-topic access control (see docs/decisions.md, DR-006).
allow_anonymous true

persistence false

# Messages arrive in bursts (72 tags per field day). The default queue of 1,000 messages
# per subscriber overflowed at fast replay speeds and silently dropped the end of each
# burst for Telegraf. Allow a much deeper queue so a slow subscriber falls behind
# instead of losing data.
max_queued_messages 500000
log_dest stdout

# Telegraf acknowledges each QoS 1 message only after writing it to InfluxDB. With the
# default limit of 20 unacknowledged messages per client, Telegraf could only receive
# about 20 messages per 2-second flush (~10/s), so the historian fell hours behind a
# fast replay while the monitor stayed current. Match Telegraf's write batch size.
max_inflight_messages 5000
