name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  batch-pipeline:
    name: Batch pipeline (clean → dbt build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests (cleaning)
        run: python -m pytest -q tests

      - name: Clean raw data
        run: python python/clean.py

      - name: Committed outputs are reproducible
        # Fails if someone edits the cleaning logic without regenerating data/processed/
        run: git diff --exit-code -- data/processed/

      - name: Build and test the warehouse
        working-directory: dbt
        run: dbt build --profiles-dir .

  realtime:
    name: Real-time layer (quality rules + compose file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r realtime/requirements.txt pytest

      - name: Data-quality rule tests
        working-directory: realtime
        run: python -m pytest -q

      - name: Validate docker-compose.yml
        working-directory: realtime
        run: docker compose config --quiet
